plugins:
  ingenic_enabled:
    default: true
    client: true

  # JSON array. Each entry describes one left navigation item so that admins can
  # reorder, hide or relabel the sidebar without a code change.
  #
  # [
  #   { "key": "home",        "label": "Home",                 "icon": "house",       "href": "/",                    "position": 0,  "enabled": true },
  #   { "key": "announce",    "label": "Official Announcements", "icon": "bullhorn", "category": "official-announcements", "position": 1, "enabled": true },
  #   { "key": "discussions", "label": "Technical Discussions",  "icon": "comments", "category": "technical-discussions",  "position": 2, "enabled": true },
  #   { "key": "docs",        "label": "Documentation",          "icon": "book",     "href": "/ingenic/docs",        "position": 3,  "enabled": true },
  #   { "key": "downloads",   "label": "Downloads",              "icon": "download", "href": "/ingenic/downloads",   "position": 4,  "enabled": true },
  #   { "key": "boards",      "label": "Development Boards",     "icon": "microchip", "href": "/ingenic/boards",     "position": 5,  "enabled": true },
  #   { "key": "github",      "label": "GitHub",                 "icon": "code-branch", "href": "https://github.com/ingenic-official", "external": true, "position": 6, "enabled": true }
  # ]
  #
  # A "category" entry resolves to /c/<slug>, so navigation can point at a forum
  # section instead of a URL. Give each chip its own category and point that
  # chip's "docs" entry at its own /ingenic/docs/<product> prefix.
  ingenic_nav_items:
    default: ""
    type: string
    multiline: true

  # JSON array controlling which blocks appear on the custom homepage and in
  # what order. Supported types: promotions, announcements, discussions,
  # downloads, boards.
  #
  # A type with no component behind it renders nothing, so a name that is not in
  # that list is a block that silently never appears.
  #
  # [
  #   { "type": "promotions",    "enabled": true,  "position": 0 },
  #   { "type": "announcements", "enabled": true,  "position": 2, "limit": 5, "category": "official-announcements" },
  #   { "type": "discussions",   "enabled": true,  "position": 3, "limit": 10, "category": "technical-discussions" },
  #   { "type": "downloads",     "enabled": true,  "position": 4, "limit": 6 },
  #   { "type": "boards",        "enabled": true,  "position": 5, "limit": 4 }
  # ]
  ingenic_homepage_blocks:
    default: ""
    type: string
    multiline: true

  # Language that documentation falls back to when a page has not been
  # translated in the reader's language. The choices are the locales this
  # Discourse can actually serve, so enabling a language in Discourse makes it
  # selectable here without touching this file — and it cannot drift into
  # offering a language no visitor can ask for.
  #
  # Codes are Discourse's own (zh_CN, pt_BR): content rows must use the same
  # spelling, because that is what I18n.locale compares against.
  ingenic_default_locale:
    default: "en"
    client: true
    enum: "LocaleSiteSetting"

  # Where the "Discuss in forum" link on a documentation page points when a page
  # has no linked topic yet.
  ingenic_docs_discussion_category:
    default: ""
    type: string
    description: "Category slug used for the 'Discuss in forum' link on a documentation page that has no linked topic."

  # Where uploaded SDKs and firmware are written. The default sits beside the
  # application rather than under public/, because a file the web server serves
  # to anyone who guesses its URL cannot be gated by anything the plugin does.
  # Point this at a larger volume if the downloads outgrow the app disk; keep it
  # outside public/ wherever it points.
  ingenic_download_storage_path:
    default: ""
    type: string
    description: "Directory that holds uploaded SDK and firmware files. Leave empty to use <app>/ingenic-downloads. Must be outside public/."

  # Where an application for an access-restricted resource is sent. Left empty,
  # applications are still recorded and shown in the admin queue, but nobody is
  # emailed about them.
  ingenic_download_admin_email:
    default: ""
    type: string
    description: "Address that receives an email when a developer applies for an access-restricted download."

  # The developer information form, as a JSON array. This is the form a visitor
  # fills in for the 'login and information' tier and above. Replacing it
  # changes the form, the validation and the admin's view of an answer together,
  # so the three cannot disagree.
  #
  # [
  #   { "key": "full_name", "label": "Full name", "type": "text", "required": true },
  #   { "key": "use_case",  "label": "Intended use", "type": "textarea", "required": true }
  # ]
  #
  # "type" is text or textarea. Leave empty to use the built-in developer form.
  ingenic_developer_form_fields:
    default: ""
    type: string
    multiline: true
    description: "JSON array describing the developer information form. Leave empty for the built-in set of fields."

  # Groups whose members wear an official identity badge beside their username.
  # One group name per entry, spelled as the group is spelled on its own page.
  # Case and stray spaces do not matter.
  #
  # The badge itself is Discourse's own group flair, which the group's own
  # settings already let an admin upload or pick as an icon. This setting only
  # decides who wears it: a member of a listed group is given that group's
  # flair. A member who already wears a badge they chose themselves keeps it,
  # and can pick up the official one from their preferences page instead.
  #
  # Listing more than one group is a way of saying which badge outranks which:
  # the first listed group a member belongs to is the one that wins.
  #
  # A listed group with no flair configured grants nothing, so this is safe to
  # fill in before the badge image is ready — the badges appear when it is
  # uploaded.
  ingenic_official_groups:
    default: "admins"
    type: list
    list_type: compact
    description: "Groups whose members wear an official identity badge beside their username. A member already wearing a badge of their own keeps it."

  # Points: what members earn for contributing, and what a resource can cost to
  # unlock. Switching this off stops the forum handing points out and stops a
  # resource being bought with them; it does not clear the ledger, and the
  # balances are where they were when it comes back on.
  #
  # An administrator adjusting an account by hand still works while this is off,
  # because that is somebody deciding on purpose rather than the forum deciding
  # for them.
  ingenic_points_enabled:
    default: true
    client: false

  # Whether administrators and moderators earn points.
  #
  # On by default: answering here is a member of staff's job rather than their
  # contribution, and a community leaderboard nobody in the community can reach
  # the top of is not much of a leaderboard. Worth knowing while trying the
  # feature out — a moderator posting to test it will see nothing happen.
  #
  # It does not stop staff *giving* points: a like from a moderator still
  # counts for the member who wrote the post.
  ingenic_points_exclude_staff:
    default: true
    client: false
