    # Why points were taken back. Written into the ledger as the reason, so it
    # stays readable after the post that caused it is gone.
    points:
      reversed_post: "对应的帖子已删除"
      reversed_like: "对应的点赞已取消"
      reversed_solution: "采纳的答案已被取消采纳"
      manual_reason: "由管理员调整"
      unlocked: "解锁了 %{resource}"

    # 高分悬赏。前四条会作为变动原因写入账目，一年后单独看到也能读懂；其余是
    # 论坛无法满足成员请求时对其说明的语句。
    bounties:
      escrow_reason: "挂出悬赏，积分托管（%{points} 积分）"
