      insufficient: "您的积分不足，无法托管该悬赏。"
      already: "该悬赏已处理完毕。"
      not_open: "该悬赏已结束。"

  # Bodies and subjects for the download centre's emails. Email::MessageBuilder
  # reads these keys by name, so they have to live under the template name the
  # mailer passes.
  ingenic_download_request_received:
    subject_template: "[%{site_name}] 下载访问申请：%{resource_name}"
    text_body_template: |
      %{applicant_name}（%{applicant_username}）申请访问受限下载资源。

      资源：%{resource_name}
      产品：%{resource_product}
      版本：%{resource_version}

      开发者资料：
      %{profile_summary}

      申请人留言：
      %{applicant_message}

      审核该申请：%{review_url}

  ingenic_download_request_approved:
    subject_template: "[%{site_name}] 下载访问已批准：%{resource_name}"
    text_body_template: |
      您好 %{recipient_username}：

      您对 %{resource_name} 的访问申请已获批准。

      现在即可下载：%{downloads_url}

      团队备注：
      %{review_note}

  ingenic_download_request_rejected:
    subject_template: "[%{site_name}] 下载访问申请：%{resource_name}"
    text_body_template: |
      您好 %{recipient_username}：

      您对 %{resource_name} 的访问申请未获批准。

      团队备注：
      %{review_note}
