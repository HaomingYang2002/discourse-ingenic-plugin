      topic_removed_reason: "悬赏所在主题已删除，积分退回"
      cancelled: "悬赏已撤回，积分已退回您的账户。"
      no_topic: "该主题不存在。"
      not_allowed: "您无法在该主题上挂出悬赏。"
      unavailable: "本论坛当前未开启悬赏。"
      too_small: "悬赏积分不得低于 %{min}。"
      too_large: "悬赏积分不得高于 %{max}。"
