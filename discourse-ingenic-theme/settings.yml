# What each navigation entry points at is configured on the plugin side, in the
# ingenic_nav_items site setting, because the same list also has to make sense to
# a signed-out visitor arriving on a shared link. These settings cover the
# layout around it.

ingenic_sidebar_width:
  default: 272
  type: integer
  description: "Width in pixels of the navigation sidebar on desktop. Below the large breakpoint Discourse's own narrower width is used instead, so content keeps its room on smaller screens."

ingenic_sidebar_position:
  default: "left"
  type: enum
  choices:
    - left
    - right
  description: "Which side the navigation sidebar renders on. On narrow screens the sidebar becomes a drawer and this has no effect."

ingenic_nav_order:
  default: "first"
  type: enum
  choices:
    - first
    - last
  description: "Whether the Ingenic navigation appears above Discourse's own sidebar sections (categories, tags, the visitor's own sections) or after them."

ingenic_nav_title:
  default: ""
  type: string
  description: "Heading over the developer-resources group — the list holding Documentation, Open Source, Downloads and Development Boards. Left empty, it reads Developer Resources (开发者资源 in Chinese). The two lists around it are drawn without a heading on purpose and are not affected by this setting."

ingenic_hero_title:
  default: ""
  type: string
  description: "Optional headline shown above the homepage blocks."

ingenic_hero_subtitle:
  default: ""
  type: string
  description: "Optional supporting text shown under the homepage headline."

ingenic_locales:
  default: "en|zh_CN"
  type: list
  description: "The languages the header's language switcher offers, most-used first. Each entry is a locale code (en, zh_CN); the menu labels them in their own language. The switcher is hidden while fewer than two are listed, and English is the language a first-time visitor gets — set it in the site's default locale setting, not here."
